<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InHire Cascade — Protótipo Vanilla JS (Hackathon VINT + INBEC)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
    <div class="font-bold text-lg tracking-tight text-slate-900">InHire Cascade · Vanilla JS</div>
    <div class="text-xs text-slate-500 font-mono-num">PostgreSQL Schema "InHire" · Zero IA Runtime</div>
  </header>

  <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- Painel de Filtros -->
    <section class="lg:col-span-4 bg-white border border-slate-200 rounded-xl p-5 space-y-4 h-fit">
      <h2 class="text-base font-bold text-slate-900">Filtros da Demanda (José)</h2>
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1" for="input-skills">Skills Requeridas (separadas por vírgula)</label>
        <input id="input-skills" type="text" value="Node.js, AWS" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1" for="select-senioridade">Senioridade Desejada</label>
        <select id="select-senioridade" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
          <option value="3" selected>Sênior</option>
          <option value="2">Pleno</option>
          <option value="4">Especialista</option>
          <option value="1">Júnior</option>
        </select>
      </div>
      <div>
        <div class="flex justify-between text-xs font-medium text-slate-700 mb-1">
          <label for="slider-disp">Disponibilidade Mínima</label>
          <span id="label-disp" class="font-mono-num font-semibold text-blue-700">50% (80h/mês)</span>
        </div>
        <input id="slider-disp" type="range" min="10" max="100" step="10" value="50" class="w-full accent-blue-600" />
      </div>
      <button id="btn-buscar" class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-lg transition">
        Executar Busca em Cascata
      </button>
    </section>

    <!-- Lista de Resultados -->
    <section class="lg:col-span-8 space-y-4">
      <div class="bg-white border border-slate-200 rounded-xl p-4 flex items-center justify-between">
        <div>
          <h1 class="text-lg font-bold text-slate-900">Ranking Unificado em Cascata</h1>
          <p class="text-xs text-slate-500">Ordem de Fallback: 1º [SGBD Interno] · 2º [InHire] · 3º [Workana API]</p>
        </div>
        <span id="contador-resultados" class="text-xs font-mono-num text-slate-600"></span>
      </div>
      <div id="lista-candidatos" class="space-y-3"></div>
    </section>
  </main>

  <script>
    // Catálogo de áreas tecnológicas para cálculo de Similaridade (Peso Y)
    const AREAS_TECNOLOGIA = {
      'node.js': 'BACKEND', 'python': 'BACKEND', 'java': 'BACKEND',
      'aws': 'CLOUD', 'azure': 'CLOUD', 'docker': 'CLOUD', 'kubernetes': 'CLOUD',
      'react': 'FRONTEND', 'vue.js': 'FRONTEND', 'angular': 'FRONTEND', 'typescript': 'FRONTEND'
    };

    const BASE_CANDIDATOS = [
      { nome: 'Rafael M. Oliveira', cargo: 'Dev Full-Stack', senioridadeId: 3, senioridade: 'Sênior', origem: '[SGBD Interno]', dispAtual: 60, dispProxMes: 60, skills: ['Node.js', 'AWS', 'TypeScript'] },
      { nome: 'Camila S. Ferreira', cargo: 'Dev Backend', senioridadeId: 3, senioridade: 'Sênior', origem: '[SGBD Interno]', dispAtual: 20, dispProxMes: 100, skills: ['Node.js', 'AWS', 'Docker'] },
      { nome: 'Lucas A. Mendes', cargo: 'Dev Backend', senioridadeId: 3, senioridade: 'Sênior', origem: '[SGBD Interno]', dispAtual: 70, dispProxMes: 70, skills: ['Node.js', 'Azure', 'Docker'] },
      { nome: 'Mariana G. Azevedo', cargo: 'Dev Backend', senioridadeId: 3, senioridade: 'Sênior', origem: '[InHire]', dispAtual: 100, dispProxMes: 100, skills: ['Node.js', 'AWS', 'PostgreSQL'] },
      { nome: 'Diego T. Vasconcelos', cargo: 'Arquiteto Serverless Freelancer', senioridadeId: 3, senioridade: 'Sênior', origem: '[Workana API]', dispAtual: 100, dispProxMes: 100, skills: ['Node.js', 'AWS', 'TypeScript'] }
    ];

    function calcularRanking() {
      const skillsInput = document.getElementById('input-skills').value.split(',').map(s => s.trim()).filter(Boolean);
      const senDesejada = Number(document.getElementById('select-senioridade').value);
      const dispMin = Number(document.getElementById('slider-disp').value);

      const avaliados = BASE_CANDIDATOS.map(cand => {
        const skillsLower = cand.skills.map(s => s.toLowerCase());
        let pontosSkill = 0;
        let motivoSkill = [];

        skillsInput.forEach(req => {
          const reqLow = req.toLowerCase();
          if (skillsLower.includes(reqLow)) {
            pontosSkill += 100;
          } else {
            const areaReq = AREAS_TECNOLOGIA[reqLow];
            const similar = cand.skills.find(sc => AREAS_TECNOLOGIA[sc.toLowerCase()] === areaReq);
            if (similar) {
              pontosSkill += 60; // Peso Y = 60%
              motivoSkill.push(`Similaridade: domina ${similar} (categoria de ${req})`);
            }
          }
        });

        const scoreSkills = skillsInput.length ? (pontosSkill / skillsInput.length) : 100;
        let scoreDisp = 0;
        let motivoDisp = `${cand.dispAtual}% disponível agora`;

        if (cand.dispAtual >= dispMin) {
          scoreDisp = 100;
        } else if (cand.dispProxMes >= dispMin) {
          scoreDisp = 82; // Peso X: Disponível em 30 dias
          motivoDisp = `Disponível em 30 dias (${cand.dispProxMes}% livre no próx. mês)`;
        }

        const scoreSen = cand.senioridadeId === senDesejada ? 100 : 75;
        const penalidadeOrigem = cand.origem === '[SGBD Interno]' ? 0 : (cand.origem === '[InHire]' ? 2 : 4);
        const scoreFinal = Math.max(0, Math.round(scoreSkills * 0.5 + scoreDisp * 0.35 + scoreSen * 0.15 - penalidadeOrigem));

        return {
          ...cand,
          scoreFinal,
          motivo: motivoSkill[0] ? `${motivoSkill[0]} · ${motivoDisp}` : motivoDisp
        };
      }).filter(c => c.scoreFinal > 40).sort((a, b) => b.scoreFinal - a.scoreFinal);

      const container = document.getElementById('lista-candidatos');
      document.getElementById('contador-resultados').textContent = `${avaliados.length} profissionais ranqueados`;
      container.innerHTML = avaliados.map(c => `
        <article class="bg-white border border-slate-200 rounded-xl p-4 flex items-center justify-between gap-4">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="font-mono-num text-xs font-semibold text-blue-700">${c.origem}</span>
              <span class="text-slate-300">·</span>
              <h3 class="font-bold text-slate-900">${c.nome}</h3>
              <span class="text-slate-300">·</span>
              <span class="text-xs text-slate-600">${c.cargo} (${c.senioridade})</span>
            </div>
            <p class="text-xs text-slate-600">Motivo do Ranking: <strong class="text-slate-800">${c.motivo}</strong></p>
            <p class="text-xs text-slate-500">Skills: ${c.skills.join(' · ')}</p>
          </div>
          <div class="text-right shrink-0">
            <div class="text-2xl font-bold font-mono-num text-slate-900">${c.scoreFinal}%</div>
            <div class="text-xs text-slate-500">Match Ponderado</div>
          </div>
        </article>
      `).join('');
    }

    document.getElementById('slider-disp').addEventListener('input', (e) => {
      const val = Number(e.target.value);
      document.getElementById('label-disp').textContent = `${val}% (${Math.round(val * 1.6)}h/mês)`;
      calcularRanking();
    });
    document.getElementById('btn-buscar').addEventListener('click', calcularRanking);
    calcularRanking();
  </script>
</body>
</html>
